  intro: 'N2 is the level employers and universities actually ask for. The kanji here are the ones that fill newspapers and official documents: economics, law, administration, industry. Most have a single dominant on''yomi and almost no useful kun''yomi, which makes them easier to read than N3 kanji but far harder to distinguish - many share components and differ only in one radical.'
