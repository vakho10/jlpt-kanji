  title: JLPT N4
  tagline: Everyday kanji - the vocabulary of schedules, directions and simple opinions.
  intro: N4 roughly doubles what you can read. The characters here build the compounds that describe time, movement, work and study, and many of them start appearing inside grammar patterns rather than as standalone words. This is also where compounds begin to outnumber single-kanji words, so reading two-character pairs as units becomes the main skill.
