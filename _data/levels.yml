  tagline: The first 79 kanji - numbers, days, directions, and the words on every sign.
  intro: N5 is where reading starts. These characters cover numbers, days of the week, the points of the compass and the handful of verbs that carry a beginner's conversation. Almost all of them are taught in the first two years of Japanese primary school, and almost all have both an on'yomi and a kun'yomi you will need, so this is the level where the two-readings habit is formed.
