  title: JLPT N3
  tagline: The bridge to intermediate Japanese - the level most learners find hardest.
  intro: N3 is the widest jump in the exam. The vocabulary turns abstract - change, decision, increase, opposition - and the kanji stop being picturable. Kun'yomi readings with okurigana become frequent, so a character can no longer be learned as a single sound. Most people who stall in Japanese stall here.
