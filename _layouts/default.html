<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    {% include head.html %}
  </head>
  <body class="d-flex flex-column min-vh-100">
    <a class="visually-hidden-focusable position-absolute top-0 start-0 m-2 p-2 bg-body border rounded"
       href="#main">Skip to content</a>

    {% include navbar.html %}

    <main id="main" class="flex-grow-1">
      {{ content }}
    </main>

    {% include footer.html %}
    {% include search-modal.html %}

    <script src="{{ '/assets/vendor/bootstrap/bootstrap.bundle.min.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
    {%- comment -%} No-ops on any page without a stroke diagram. {%- endcomment -%}
    <script src="{{ '/assets/js/stroke-order.js' | relative_url }}" defer></script>
  </body>
</html>
